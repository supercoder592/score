<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口袋裁判</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* 版面概念:上下對打的直向球場置中滿版,比分橫幅在上、操作列在下,一屏完成 */
:root{
  --bg:#f4f4f1; --fg:#1d1c19; --muted:#73706a; --card:#ffffff; --line:#e0dfd8;
  --t0:#2563eb; --t1:#d6453a; --ok:#1d9a53; --err:#d6453a;
  --btn:#ffffff; --btn-br:#d7d5cd;
  --disp:"Barlow Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --ui:ui-sans-serif,system-ui,"PingFang TC","Noto Sans TC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131314; --fg:#ecebe6; --muted:#98958d; --card:#1d1d1f; --line:#2c2c2f;
    --t0:#6b96f5; --t1:#ef7064; --ok:#3dbb74; --err:#ef7064;
    --btn:#242426; --btn-br:#3a3a3e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131314; --fg:#ecebe6; --muted:#98958d; --card:#1d1d1f; --line:#2c2c2f;
  --t0:#6b96f5; --t1:#ef7064; --ok:#3dbb74; --err:#ef7064;
  --btn:#242426; --btn-br:#3a3a3e; color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
button{font-family:var(--ui);font-size:15px;color:var(--fg);background:var(--btn);
  border:1px solid var(--btn-br);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--t0);outline-offset:2px}
input[type=text]{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--btn-br);
  border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}

/* ---- 設定頁 ---- */
.setup{overflow-y:auto;padding-block:28px 40px;display:flex;flex-direction:column;gap:22px}
.setup h1{font-family:var(--disp);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:.02em}
.setup .tag{color:var(--muted);margin:6px 0 0;font-size:15px}
.fld{display:flex;flex-direction:column;gap:9px}
.fld label{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.opts{display:flex;gap:9px;flex-wrap:wrap}
.opt{flex:1;min-width:96px;text-align:center;border:1.5px solid var(--btn-br);background:var(--card);
  border-radius:12px;padding:13px 8px;font-size:16px}
.opt.sel{border-color:var(--fg);font-weight:700}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
.teamrow{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.go{background:var(--fg);color:var(--bg);border:none;font-size:19px;font-weight:700;padding:16px;border-radius:14px}

/* ---- 比賽頁 ---- */
.match{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding-block:10px}
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.trow{display:grid;grid-template-columns:14px 1fr auto 74px;align-items:center;gap:10px;padding:3px 0}
.trow .nm{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.trow .nm span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srv{font-size:11px;background:var(--fg);color:var(--bg);border-radius:6px;padding:1px 6px;flex:none}
.trow .sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .big{font-family:var(--disp);font-weight:700;font-size:44px;line-height:1;text-align:right;
  font-variant-numeric:tabular-nums}
.mid{display:flex;justify-content:center;gap:8px;border-top:1px dashed var(--line);margin-top:4px;padding-top:5px;min-height:20px;align-items:center}
.chip{font-size:12.5px;color:var(--muted)}
.chip.call{font-family:var(--disp);font-size:17px;font-weight:600;color:var(--fg);letter-spacing:.06em}

.courtwrap{flex:1;min-height:0;position:relative;display:flex;justify-content:center}
.courtwrap svg{height:100%;max-width:100%;touch-action:manipulation;display:block;border-radius:12px}
.flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;gap:2px}
.flash b{font-family:var(--disp);font-size:56px;font-weight:700;letter-spacing:.08em;
  color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.flash span{font-size:16px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);background:rgba(0,0,0,.35);
  padding:2px 12px;border-radius:99px}
.flash.in b{color:#8ff0b4}.flash.out b{color:#ffb3a7}
.flash.anim{animation:pop 1.6s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.flash.anim{animation:none;opacity:.95}}

.hint{text-align:center;color:var(--muted);font-size:13.5px;min-height:18px;padding:0 4px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-bottom:max(4px,env(safe-area-inset-bottom,0px))}
.ctrl button{flex:1;min-width:72px;font-size:14px;padding:9px 6px}
.ctrl .aw0{border-color:var(--t0);color:var(--t0);font-weight:600}
.ctrl .aw1{border-color:var(--t1);color:var(--t1);font-weight:600}

.ovl{position:absolute;inset:0;background:rgba(10,10,12,.45);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;border-radius:12px;z-index:5}
.ovl .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;
  width:min(320px,86%);text-align:center;display:flex;flex-direction:column;gap:12px}
.ovl h2{margin:0;font-family:var(--disp);font-size:30px;font-weight:700}
.ovl p{margin:0;color:var(--muted);font-size:14.5px}
.ovl .sc{font-family:var(--disp);font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= 基本資料 ================= */
const SPORTS={
  bad:{label:'羽球', L:13.4, W:6.1, margin:1.4, surface:'#2f6b50', out:'#265741', gameTo:21, cap:30, decider:11},
  pb :{label:'皮克球', L:13.41, W:6.10, margin:1.4, kitchen:2.134, surface:'#1f6e86', out:'#1a5668',
       kitchenFill:'#2c7e97', gameTo:11, decider:6},
  ten:{label:'網球', L:23.77, W:10.97, margin:2.3, surface:'#33659c', out:'#2a4f7c', svcFromNet:6.40}
};
const INSET={bad:0.46, ten:1.37, pb:0};
const EPS=0.03; // 壓線容差(公尺)
const LS_KEY='pocket-ref-v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let view='setup';
let setup={sport:'bad', mode:'singles', pbScoring:'sideout', tenSets:1, first:0, names:['藍隊','紅隊']};
let M=null;       // 比賽狀態(可 JSON 序列化,支援復原)
let hist=[];      // 復原堆疊
let flashKey=0;
let confirmQuit=false;

/* ================= 幾何 ================= */
const G=()=>SPORTS[M.sport];
const NET=()=>G().L/2;
const isDbl=()=>M.mode==='doubles';
function sideBounds(){ // 回合判定的左右邊線
  const i=(M.sport==='pb')?0:(M.mode==='singles'?INSET[M.sport]:0);
  return [i, G().W-i];
}
function servingTeam(){
  if(M.sport==='ten'&&M.tb){
    const n=M.tb.pts[0]+M.tb.pts[1], grp=Math.floor((n+1)/2);
    return grp%2===0?M.tb.starter:1-M.tb.starter;
  }
  return M.serving;
}
function serveCourt(){ // 'R' / 'L'(發球者自己視角)
  if(M.sport==='ten'){
    if(M.tb){const n=M.tb.pts[0]+M.tb.pts[1];return n===0?'R':(n%2===1?'L':'R');}
    return (M.pts[0]+M.pts[1])%2===0?'R':'L';
  }
  if(M.sport==='pb'&&M.pbScoring==='sideout'&&isDbl())
    return M.pos[M.serving][0]===M.pbServerPlayer?'R':'L';
  return M.pts[servingTeam()]%2===0?'R':'L';
}
function serveBoxRect(){
  const g=G(), N=NET(), s=servingTeam();
  const srvBottom=(M.bottom===s);          // 發球方在畫面下半
  const recvTop=srvBottom;                 // 接球方在上半
  const court=serveCourt();
  const srvRightScreen=srvBottom?(court==='R'):(court==='L');
  const targetRight=!srvRightScreen;       // 對角
  let xb;
  if(M.sport==='ten') xb=[INSET.ten, g.W-INSET.ten];
  else if(M.sport==='bad') xb=(M.mode==='singles')?[INSET.bad,g.W-INSET.bad]:[0,g.W];
  else xb=[0,g.W];
  const x0=targetRight?g.W/2:xb[0], x1=targetRight?xb[1]:g.W/2;
  let y0,y1,kitchenEdge=null; // kitchenEdge: 皮克球發球不可落的那條界(含線)
  if(M.sport==='bad'){
    const deep=isDbl()?0.76:0;
    if(recvTop){y0=deep;y1=N-1.98;}else{y0=N+1.98;y1=g.L-deep;}
  }else if(M.sport==='ten'){
    if(recvTop){y0=N-g.svcFromNet;y1=N;}else{y0=N;y1=N+g.svcFromNet;}
  }else{
    if(recvTop){y0=0;y1=N-g.kitchen;kitchenEdge='far';}
    else{y0=N+g.kitchen;y1=g.L;kitchenEdge='near';}
  }
  return {x0,x1,y0,y1,recvTop,kitchenEdge};
}
function judgeServeIn(p){
  const b=serveBoxRect();
  let ok=p.x>=b.x0-EPS&&p.x<=b.x1+EPS&&p.y>=b.y0-EPS&&p.y<=b.y1+EPS;
  if(ok&&M.sport==='pb'){ // Kitchen 線含線皆為失誤
    if(b.recvTop ? p.y>b.y1-0.001 : p.y<b.y0+0.001) ok=false;
  }
  return ok;
}

/* ================= 規則引擎 ================= */
function swapPos(t){M.pos[t]=[M.pos[t][1],M.pos[t][0]];}
function flipEnds(why){M.bottom=1-M.bottom;M.note=why||'交換場地';}
function setFlash(kind,big,sub){M.flash={kind,big,sub};flashKey++;}

function rallyWon(w,why){ // w = 這一球的勝方
  M.stale=true;
  if(M.sport==='pb'&&M.pbScoring==='sideout'){
    if(w===M.serving) pbScore(); else pbLoseServe(why);
  } else pointWon(w);
}
function pointWon(w){
  if(M.sport==='ten') return tenPoint(w);
  M.pts[w]++;
  if(w===M.serving){ if(isDbl()) swapPos(w); } else M.serving=w;
  afterScoreBP(w);
}
function pbScore(){
  const s=M.serving;
  M.pts[s]++;
  if(isDbl()) swapPos(s); // 發球員與同伴換邊,續發
  afterScoreBP(s);
}
function pbLoseServe(why){
  if(isDbl()&&M.pbServerNum===1){
    M.pbServerNum=2;
    M.pbServerPlayer=1-M.pbServerPlayer;
    M.note=(why?why+' — ':'')+'換第二發球員';
  }else{
    M.serving=1-M.serving;
    M.pbServerNum=1;
    M.pbServerPlayer=isDbl()?M.pos[M.serving][0]:0;
    M.note=(why?why+' — ':'')+'換發(Side Out)';
  }
}
function afterScoreBP(w){ // 羽球 / 皮克球共用:決勝局換邊與局末
  const g=G(), p=M.pts[w], o=M.pts[1-w];
  const decider=(M.games[0]+M.games[1])===2;
  if(decider&&!M.midSwap&&Math.max(M.pts[0],M.pts[1])>=g.decider){
    M.midSwap=true; flipEnds(`決勝局 ${g.decider} 分,交換場地`);
  }
  const won=(p>=g.gameTo&&p-o>=2)||(g.cap&&p>=g.cap);
  if(won){
    M.games[w]++;
    if(M.games[w]>=2){M.phase='over';M.winner=w;}
    else{
      M.phase='between';
      M.between={title:`第 ${M.games[0]+M.games[1]} 局結束`,
        sub:`${M.names[w]} ${M.pts[w]}–${M.pts[1-w]} 拿下本局,請雙方交換場地`,
        nextWinner:w};
    }
  }
}
function startNextGameBP(){
  const w=M.between.nextWinner;
  M.pts=[0,0]; M.serving=w; M.pos=[[0,1],[0,1]];
  M.pbServerNum=(M.sport==='pb'&&M.pbScoring==='sideout'&&isDbl())?2:1;
  M.pbServerPlayer=0;
  M.midSwap=false; M.marks=[]; M.between=null; M.phase='serve';
  flipEnds('已交換場地');
  M.note=`第 ${M.games[0]+M.games[1]+1} 局開始,${M.names[w]} 先發`;
}
/* ---- 網球 ---- */
function tenPoint(w){
  M.fault=false;
  if(M.tb){
    M.tb.pts[w]++;
    const a=M.tb.pts[0],b=M.tb.pts[1];
    if(Math.max(a,b)>=7&&Math.abs(a-b)>=2){
      M.serving=1-M.tb.starter;
      M.games[w]++;
      flipEnds(); // 7-6 共 13 局,換邊
      tenSetWon(w,true);
    }else if((a+b)%6===0) flipEnds('搶七局:每 6 分交換場地');
    return;
  }
  M.pts[w]++;
  const p=M.pts[w],o=M.pts[1-w];
  if(p>=4&&p-o>=2) tenGameWon(w);
}
function tenGameWon(w){
  M.games[w]++; M.pts=[0,0];
  if(isDbl()) M.tenNextSrv[M.serving]^=1;
  M.serving=1-M.serving;
  const a=M.games[0],b=M.games[1],sum=a+b;
  const setOver=(Math.max(a,b)>=6&&Math.abs(a-b)>=2);
  if(sum%2===1) flipEnds('單數局結束,交換場地');
  if(setOver){tenSetWon(w,false);return;}
  if(a===6&&b===6){M.tb={pts:[0,0],starter:M.serving};M.note='6–6 進入搶七';}
}
function tenSetWon(w,fromTb){
  M.sets[w]++;
  const finalGames=`${M.games[0]}–${M.games[1]}${fromTb?'(搶七)':''}`;
  M.tb=null;
  const need=(M.tenSets===1)?1:2;
  if(M.sets[w]>=need){M.phase='over';M.winner=w;return;}
  M.games=[0,0];M.pts=[0,0];
  M.phase='between';
  M.between={title:`第 ${M.sets[0]+M.sets[1]} 盤結束`,
    sub:`${M.names[w]} 以 ${finalGames} 拿下本盤`,ten:true};
}
function startNextSetTen(){
  M.between=null;M.marks=[];M.phase='serve';
  M.note=`第 ${M.sets[0]+M.sets[1]+1} 盤開始`;
}

/* ================= 點擊判定 ================= */
function handleTap(x,y){
  if(!M||(M.phase!=='serve'&&M.phase!=='rally'))return;
  act(()=>{
    if(M.stale){M.marks=[];M.stale=false;M.note='';}
    if(M.phase==='serve') judgeServe({x,y}); else judgeRally({x,y});
  });
}
function judgeServe(p){
  const ok=judgeServeIn(p), s=servingTeam(), r=1-s;
  M.marks.push({x:p.x,y:p.y,ok,kind:'serve'});
  if(ok){
    if(M.sport==='bad'){ // 羽球落地即死球:發球直接落在發球區內 = 發球方得分
      setFlash('in','界內',`發球落於發球區內,${M.names[s]} 得分`);
      rallyWon(s);
    }else{
      M.phase='rally';
      setFlash('in','發球有效','繼續對打');
    }
    return;
  }
  // 發球失誤
  if(M.sport==='ten'){
    if(!M.fault){M.fault=true;M.stale=false;setFlash('out','FAULT','一發失誤,請發第二球');}
    else{M.fault=false;setFlash('out','雙發失誤',`${M.names[r]} 得分`);M.stale=true;tenPoint(r);}
    return;
  }
  if(M.sport==='pb'){
    setFlash('out','發球失誤', M.pbScoring==='sideout'?'失去發球權':`${M.names[r]} 得分`);
    rallyWon(r,'發球失誤');
    return;
  }
  setFlash('out','發球出區',`${M.names[r]} 得分`); // 羽球
  rallyWon(r);
}
function judgeRally(p){
  const g=G(), xb=sideBounds();
  const landT=(p.y<=NET())?(1-M.bottom):M.bottom;       // 落點在哪一隊的半場
  const inC=p.x>=xb[0]-EPS&&p.x<=xb[1]+EPS&&p.y>=-EPS&&p.y<=g.L+EPS;
  const w=inC?1-landT:landT;
  M.marks.push({x:p.x,y:p.y,ok:inC,kind:'end'});
  if(inC) setFlash('in','界內',`${M.names[landT]} 未能回擊,${M.names[w]} 勝此球`);
  else    setFlash('out','出界',`${M.names[w]} 勝此球`);
  rallyWon(w, inC?null:'出界');
}

/* ================= 動作 ================= */
function act(fn){
  hist.push(JSON.stringify(M));
  if(hist.length>150)hist.shift();
  fn(); save(); render();
}
function undo(){
  if(!hist.length)return;
  M=JSON.parse(hist.pop()); flashKey++; M.flash=null; save(); render();
}
function serveGood(){ // 羽球:已回擊 / 網球皮克球:略過發球落點
  act(()=>{ if(M.stale){M.marks=[];M.stale=false;} M.phase='rally'; M.note='對打中'; M.flash=null;});
}
function letServe(){
  act(()=>{M.phase='serve';M.marks=[];M.stale=false;M.flash=null;M.note='重新發球(Let)';});
}
function manualAward(t){
  act(()=>{
    if(M.stale){M.marks=[];M.stale=false;}
    M.fault=false;
    setFlash(t===0?'in':'in','判定',`裁判判 ${M.names[t]} 勝此球`);
    M.phase='serve'; // 直接回發球(避免停在 rally)
    rallyWon(t,'裁判判定');
    if(M.phase==='rally')M.phase='serve';
  });
}
function continueNext(){
  act(()=>{ if(M.between&&M.between.ten) startNextSetTen(); else startNextGameBP(); });
}
function newMatch(){
  M={sport:setup.sport,mode:setup.mode,pbScoring:setup.pbScoring,tenSets:setup.tenSets,
     names:[...setup.names],
     pts:[0,0],games:[0,0],sets:[0,0],
     serving:setup.first,bottom:0,
     pos:[[0,1],[0,1]],
     pbServerNum:(setup.sport==='pb'&&setup.pbScoring==='sideout'&&setup.mode==='doubles')?2:1,
     pbServerPlayer:0,
     tenNextSrv:[0,0],fault:false,tb:null,
     phase:'serve',marks:[],stale:false,note:'',flash:null,
     midSwap:false,between:null,winner:null};
  hist=[]; view='match'; save(); render();
}
function quitToSetup(){
  M=null;hist=[];view='setup';confirmQuit=false;
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  render();
}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({v:1,setup,M,hist:hist.slice(-40),view}));}catch(e){}
}

/* ================= 顯示輔助 ================= */
function tenPtsLabel(t){
  if(M.tb)return M.tb.pts[t];
  const p=M.pts[t],o=M.pts[1-t],map=['0','15','30','40'];
  if(p>=3&&o>=3){if(p===o)return'40';return p>o?'Ad':'40';}
  return map[Math.min(p,3)];
}
function serverDesc(){
  const s=servingTeam();
  let who=M.names[s];
  if(isDbl()){
    let idx=null;
    if(M.sport==='bad') idx=M.pos[s][serveCourt()==='R'?0:1];
    else if(M.sport==='pb'&&M.pbScoring==='sideout') idx=M.pbServerPlayer;
    else if(M.sport==='pb') idx=M.pos[s][serveCourt()==='R'?0:1];
    else if(M.sport==='ten'&&!M.tb) idx=M.tenNextSrv[s];
    if(idx!==null) who+=` ${idx+1} 號`;
  }
  return who;
}
function hintText(){
  if(!M)return'';
  if(M.phase==='serve'){
    const c=serveCourt()==='R'?'右':'左';
    let t=`${serverDesc()} 於${c}發球區發球 — 點擊發球落點`;
    if(M.sport==='ten'&&M.fault)t='【第二發球】'+t;
    if(M.sport==='bad')t+=';若發球已被回擊,按「已回擊」';
    return t;
  }
  if(M.phase==='rally')return'對打中 — 點擊結束這一球的落點(出界,或無法回擊的第一跳)';
  return'';
}

/* ================= 球場 SVG ================= */
function playerSpots(){
  const g=G(),N=NET(),s=servingTeam(),r=1-s,court=serveCourt();
  const srvBottom=(M.bottom===s);
  const srvRight=srvBottom?(court==='R'):(court==='L');
  const xq=right=>right?g.W*0.74:g.W*0.26;
  const yd=(bottomSide,d)=>bottomSide?N+d:N-d;
  const deep={bad:3.1,pb:6.15,ten:11.3}[M.sport];
  const mid ={bad:4.9,pb:4.6,ten:5.6}[M.sport];
  const netD={bad:2.0,pb:1.6,ten:3.2}[M.sport];
  const out=[];
  const srvIdx=(()=>{ if(!isDbl())return 0;
    if(M.sport==='bad')return M.pos[s][court==='R'?0:1];
    if(M.sport==='pb'&&M.pbScoring==='sideout')return M.pbServerPlayer;
    if(M.sport==='pb')return M.pos[s][court==='R'?0:1];
    return M.tb?0:M.tenNextSrv[s];})();
  const rcvIdx=(()=>{ if(!isDbl())return 0;
    if(M.sport==='ten')return 0;
    return M.pos[r][court==='R'?0:1];})();
  out.push({x:xq(srvRight),y:yd(srvBottom,M.sport==='bad'?3.1:deep),t:s,n:srvIdx,srv:true});
  out.push({x:xq(!srvRight),y:yd(!srvBottom,M.sport==='bad'?3.1:deep),t:r,n:rcvIdx,srv:false});
  if(isDbl()){
    out.push({x:xq(!srvRight),y:yd(srvBottom,M.sport==='ten'?netD:mid),t:s,n:1-srvIdx,srv:false});
    out.push({x:xq(srvRight),y:yd(!srvBottom,M.sport==='ten'?mid:netD),t:r,n:M.sport==='ten'?1:1-rcvIdx,srv:false});
  }
  return out;
}
function courtSVG(){
  const g=G(),W=g.W,L=g.L,mg=g.margin,N=NET(),c=W/2,lw=0.055;
  const LN='rgba(255,255,255,.95)';
  const line=(x1,y1,x2,y2,w,col,dash)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col||LN}" stroke-width="${w||lw}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
  let s='';
  s+=`<rect x="${-mg}" y="${-mg}" width="${W+2*mg}" height="${L+2*mg}" fill="${g.out}"/>`;
  s+=`<rect x="0" y="0" width="${W}" height="${L}" fill="${g.surface}"/>`;
  if(M.sport==='pb'){
    s+=`<rect x="0" y="${N-g.kitchen}" width="${W}" height="${g.kitchen*2}" fill="${g.kitchenFill}"/>`;
  }
  // 發球目標區高亮
  if(M.phase==='serve'){
    const b=serveBoxRect(),tc=servingTeam()===0?'var(--t0)':'var(--t1)';
    s+=`<rect x="${b.x0}" y="${b.y0}" width="${b.x1-b.x0}" height="${b.y1-b.y0}" fill="${tc}" opacity="0.30"/>`;
    s+=`<rect x="${b.x0}" y="${b.y0}" width="${b.x1-b.x0}" height="${b.y1-b.y0}" fill="none" stroke="#fff" stroke-width="${lw*0.9}" stroke-dasharray="0.22 0.14"/>`;
  }
  s+=`<rect x="0" y="0" width="${W}" height="${L}" fill="none" stroke="${LN}" stroke-width="${lw}"/>`;
  if(M.sport==='bad'){
    const i=INSET.bad;
    s+=line(i,0,i,L)+line(W-i,0,W-i,L);
    s+=line(0,N-1.98,W,N-1.98)+line(0,N+1.98,W,N+1.98);
    s+=line(0,0.76,W,0.76)+line(0,L-0.76,W,L-0.76);
    s+=line(c,0,c,N-1.98)+line(c,N+1.98,c,L);
  }else if(M.sport==='ten'){
    const i=INSET.ten,sv=g.svcFromNet;
    if(M.mode==='doubles'){s+=line(i,0,i,L)+line(W-i,0,W-i,L);}
    else{s+=line(i,0,i,L)+line(W-i,0,W-i,L);}
    s+=line(i,N-sv,W-i,N-sv)+line(i,N+sv,W-i,N+sv);
    s+=line(c,N-sv,c,N+sv);
    s+=line(c,0,c,0.35,lw)+line(c,L-0.35,c,L,lw); // 中點標
  }else{
    s+=line(0,N-g.kitchen,W,N-g.kitchen)+line(0,N+g.kitchen,W,N+g.kitchen);
    s+=line(c,0,c,N-g.kitchen)+line(c,N+g.kitchen,c,L);
  }
  s+=line(-mg*0.5,N,W+mg*0.5,N,0.12,'rgba(12,16,22,.8)','0.22 0.13'); // 網
  // 站位
  const R=L*0.022+0.12;
  for(const p of playerSpots()){
    const col=p.t===0?'var(--t0)':'var(--t1)';
    s+=`<g>`;
    if(p.srv)s+=`<circle cx="${p.x}" cy="${p.y}" r="${R*1.45}" fill="none" stroke="#fff" stroke-width="${R*0.22}" opacity=".9"/>`;
    s+=`<circle cx="${p.x}" cy="${p.y}" r="${R}" fill="${col}" stroke="rgba(0,0,0,.25)" stroke-width="${R*0.08}"/>`;
    if(isDbl())s+=`<text x="${p.x}" y="${p.y}" fill="#fff" font-size="${R*1.2}" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="700">${p.n+1}</text>`;
    s+=`</g>`;
  }
  // 落點標記
  for(const mk of M.marks){
    const r=L*0.014+0.08;
    if(mk.ok){
      s+=`<circle cx="${mk.x}" cy="${mk.y}" r="${r}" fill="#ffe14d" stroke="rgba(0,0,0,.5)" stroke-width="${r*0.18}"/>`;
    }else{
      const d=r*1.15,w=r*0.42;
      s+=`<g stroke="#ff5d4d" stroke-width="${w}" stroke-linecap="round">`+
         `<line x1="${mk.x-d}" y1="${mk.y-d}" x2="${mk.x+d}" y2="${mk.y+d}"/>`+
         `<line x1="${mk.x-d}" y1="${mk.y+d}" x2="${mk.x+d}" y2="${mk.y-d}"/></g>`;
    }
  }
  return `<svg id="court" viewBox="${-mg} ${-mg} ${W+2*mg} ${L+2*mg}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="球場,點擊記錄落點">${s}</svg>`;
}

/* ================= 畫面 ================= */
const app=document.getElementById('app');
function render(){ app.innerHTML=(view==='setup')?setupHTML():matchHTML(); bind(); }

function optBtn(act,val,cur,label,sub){
  return `<button class="opt${cur===val?' sel':''}" data-a="${act}" data-v="${val}">${label}${sub?`<small>${sub}</small>`:''}</button>`;
}
function setupHTML(){
  const s=setup;
  return `<div class="setup">
    <div><h1>口袋裁判</h1><p class="tag">點擊球的落點,自動判界、計分、管站位</p></div>
    <div class="fld"><label>運動</label><div class="opts">
      ${optBtn('sport','bad',s.sport,'羽球','21 分 × 3 局')}
      ${optBtn('sport','pb',s.sport,'皮克球','11 分 × 3 局')}
      ${optBtn('sport','ten',s.sport,'網球','局 / 盤制')}
    </div></div>
    <div class="fld"><label>人數</label><div class="opts">
      ${optBtn('mode','singles',s.mode,'單打')}
      ${optBtn('mode','doubles',s.mode,'雙打')}
    </div></div>
    ${s.sport==='pb'?`<div class="fld"><label>計分制</label><div class="opts">
      ${optBtn('pbs','sideout',s.pbScoring,'傳統側出','僅發球方得分')}
      ${optBtn('pbs','rally',s.pbScoring,'每球得分','簡化 Rally 制')}
    </div></div>`:''}
    ${s.sport==='ten'?`<div class="fld"><label>賽制</label><div class="opts">
      ${optBtn('tsets','1',String(s.tenSets),'單盤')}
      ${optBtn('tsets','3',String(s.tenSets),'三盤兩勝')}
    </div></div>`:''}
    <div class="fld"><label>隊伍名稱</label>
      <div class="teamrow"><span class="dot" style="background:var(--t0)"></span>
        <input type="text" id="nm0" maxlength="8" value="${esc(s.names[0])}" aria-label="隊伍一名稱"></div>
      <div class="teamrow"><span class="dot" style="background:var(--t1)"></span>
        <input type="text" id="nm1" maxlength="8" value="${esc(s.names[1])}" aria-label="隊伍二名稱"></div>
    </div>
    <div class="fld"><label>先發球</label><div class="opts">
      ${optBtn('first','0',String(s.first),esc(s.names[0]))}
      ${optBtn('first','1',String(s.first),esc(s.names[1]))}
    </div></div>
    <button class="go" data-a="start">開始比賽</button>
  </div>`;
}

function teamRowHTML(t){
  const serving=servingTeam()===t&&(M.phase==='serve'||M.phase==='rally');
  let sub;
  if(M.sport==='ten')sub=`盤 ${M.sets[t]} · 局 ${M.games[t]}`;
  else sub=`局 ${M.games[t]}`;
  let badge='';
  if(serving){
    badge='<span class="srv">發</span>';
    if(M.sport==='pb'&&M.pbScoring==='sideout'&&isDbl())badge=`<span class="srv">發 S${M.pbServerNum}</span>`;
  }
  const big=M.sport==='ten'?tenPtsLabel(t):M.pts[t];
  return `<div class="trow">
    <span class="dot" style="background:${t===0?'var(--t0)':'var(--t1)'}"></span>
    <div class="nm"><span class="n">${esc(M.names[t])}</span>${badge}</div>
    <span class="sub">${sub}</span>
    <span class="big" style="color:${t===0?'var(--t0)':'var(--t1)'}">${big}</span>
  </div>`;
}
function midHTML(){
  const chips=[];
  if(M.sport==='pb'&&M.pbScoring==='sideout'){
    const s=M.serving;
    const call=isDbl()?`${M.pts[s]} – ${M.pts[1-s]} – ${M.pbServerNum}`:`${M.pts[s]} – ${M.pts[1-s]}`;
    chips.push(`<span class="chip">報分</span><span class="chip call">${call}</span>`);
  }
  if(M.sport==='ten'){
    if(M.tb)chips.push('<span class="chip call">搶七</span>');
    else if(M.pts[0]>=3&&M.pts[1]>=3&&M.pts[0]===M.pts[1])chips.push('<span class="chip call">Deuce</span>');
    if(M.fault)chips.push('<span class="chip">第二發球</span>');
  }
  if(M.note)chips.push(`<span class="chip">${esc(M.note)}</span>`);
  return chips.join('');
}
function matchHTML(){
  const top=1-M.bottom,bot=M.bottom;
  const inPlay=M.phase==='serve'||M.phase==='rally';
  let ovl='';
  if(confirmQuit){
    ovl=`<div class="ovl"><div class="card"><h2>結束比賽?</h2><p>目前比分將被清除,回到設定頁。</p>
      <button data-a="quitYes" style="background:var(--err);color:#fff;border:none">結束比賽</button>
      <button data-a="quitNo">繼續比賽</button></div></div>`;
  }else if(M.phase==='between'){
    ovl=`<div class="ovl"><div class="card"><h2>${esc(M.between.title)}</h2>
      <div class="sc"><span style="color:var(--t0)">${M.sport==='ten'?M.sets[0]:M.games[0]}</span> – <span style="color:var(--t1)">${M.sport==='ten'?M.sets[1]:M.games[1]}</span></div>
      <p>${esc(M.between.sub)}</p>
      <button class="go" data-a="cont">${M.sport==='ten'?'開始下一盤':'開始下一局'}</button></div></div>`;
  }else if(M.phase==='over'){
    const w=M.winner;
    const fin=M.sport==='ten'?`盤數 ${M.sets[0]} – ${M.sets[1]}`:`局數 ${M.games[0]} – ${M.games[1]}`;
    ovl=`<div class="ovl"><div class="card"><h2>比賽結束</h2>
      <div class="sc" style="color:${w===0?'var(--t0)':'var(--t1)'}">${esc(M.names[w])} 勝</div>
      <p>${fin}</p>
      <button class="go" data-a="rematch">再賽一場</button>
      <button data-a="quitYes">回到設定</button></div></div>`;
  }
  const flash=M.flash?`<div class="flash anim ${M.flash.kind}" data-k="${flashKey}"><b>${esc(M.flash.big)}</b><span>${esc(M.flash.sub)}</span></div>`:'';
  const srvBtn=M.phase==='serve'?`<button data-a="good">${M.sport==='bad'?'已回擊':'發球良好'}</button>`:'';
  return `<div class="match">
    <div class="board">${teamRowHTML(top)}${teamRowHTML(bot)}<div class="mid">${midHTML()}</div></div>
    <div class="courtwrap">${courtSVG()}${flash}${ovl}</div>
    <div class="hint">${hintText()}</div>
    <div class="ctrl">
      <button data-a="undo" ${hist.length?'':'disabled'}>↺ 復原</button>
      <button data-a="let" ${inPlay?'':'disabled'}>重新發球</button>
      ${srvBtn}
      <button class="aw${top}" data-a="award" data-v="${top}" ${inPlay?'':'disabled'}>判${esc(M.names[top])}勝</button>
      <button class="aw${bot}" data-a="award" data-v="${bot}" ${inPlay?'':'disabled'}>判${esc(M.names[bot])}勝</button>
      <button data-a="quit">✕</button>
    </div>
  </div>`;
}

function bind(){
  app.querySelectorAll('[data-a]').forEach(el=>{
    el.addEventListener('click',()=>{
      const a=el.dataset.a,v=el.dataset.v;
      if(a==='sport'){setup.sport=v;render();}
      else if(a==='mode'){setup.mode=v;render();}
      else if(a==='pbs'){setup.pbScoring=v;render();}
      else if(a==='tsets'){setup.tenSets=+v;render();}
      else if(a==='first'){setup.first=+v;render();}
      else if(a==='start'){
        const n0=document.getElementById('nm0').value.trim(),n1=document.getElementById('nm1').value.trim();
        setup.names=[n0||'藍隊',n1||'紅隊'];newMatch();
      }
      else if(a==='undo')undo();
      else if(a==='let')letServe();
      else if(a==='good')serveGood();
      else if(a==='award')manualAward(+v);
      else if(a==='cont')continueNext();
      else if(a==='quit'){confirmQuit=true;render();}
      else if(a==='quitNo'){confirmQuit=false;render();}
      else if(a==='quitYes')quitToSetup();
      else if(a==='rematch'){setup.names=[...M.names];newMatch();}
    });
  });
  const nm0=document.getElementById('nm0'),nm1=document.getElementById('nm1');
  if(nm0)nm0.addEventListener('input',e=>{setup.names[0]=e.target.value;refreshFirstLabels();});
  if(nm1)nm1.addEventListener('input',e=>{setup.names[1]=e.target.value;refreshFirstLabels();});
  const svg=document.getElementById('court');
  if(svg)svg.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const m=svg.getScreenCTM();if(!m)return;
    const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
    handleTap(pt.x,pt.y);
  });
}
function refreshFirstLabels(){
  app.querySelectorAll('[data-a="first"]').forEach(b=>{
    b.childNodes[0].textContent=(b.dataset.v==='0'?setup.names[0]:setup.names[1])||(b.dataset.v==='0'?'藍隊':'紅隊');
  });
}

/* ================= 開機 ================= */
function boot(data){
  try{
    const d=data&&data.M!==undefined?data:JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(d&&d.setup)setup=Object.assign(setup,d.setup);
    if(d&&d.M&&d.M.phase!=='over'){M=d.M;hist=d.hist||[];view='match';}
  }catch(e){}
  render();
}
if(window.claude&&window.claude.hot){
  try{window.claude.hot.snapshot(()=>({setup,M,hist:hist.slice(-40),view}));}catch(e){}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(d=>boot(d&&d.M!==undefined?d:null));
else boot(hot&&hot.data?hot.data:null);

/* 測試掛鉤(不影響一般使用) */
window.__ref={
  tap:handleTap, state:()=>M, box:serveBoxRect, court:serveCourt, servingTeam,
  good:serveGood, undo, cont:continueNext, award:manualAward,
  start:(o)=>{Object.assign(setup,o);newMatch();}
};
</script>
</body>
</html>
